<ion-header [translucent]="true" class="app-page-header team-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Integrantes</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="team-content">
  <div class="team-shell ion-padding">
    <section class="team-intro">
      <div class="intro-icon">
        <ion-icon name="people-outline"></ion-icon>
      </div>
      <p class="eyebrow">Programación Móvil</p>
      <h1>Equipo de trabajo</h1>
      <p>Conoce a los estudiantes responsables de este proyecto académico.</p>
      <div class="university-line">
        <ion-icon name="school-outline"></ion-icon>
        <span>Universidad Libre</span>
      </div>
    </section>

    <section class="members" aria-labelledby="members-title">
      <h2 id="members-title">Integrantes</h2>

      <article class="member-card">
        <div class="avatar avatar-one">DG</div>
        <div class="member-info">
          <p class="member-role">Estudiante</p>
          <h3>Daniel Leonardo Gonzalez Torres</h3>
          <p>Ingeniería de Sistemas</p>
        </div>
      </article>

      <article class="member-card">
        <div class="avatar avatar-two">SA</div>
        <div class="member-info">
          <p class="member-role">Estudiante</p>
          <h3>Sergio Andres Merchan Rozo</h3>
          <p>Ingeniería de Sistemas</p>
        </div>
      </article>
    </section>
  </div>
</ion-content>
